<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fc4e8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%84%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>3D 衝浪 Surfing 3D</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="gameCanvas" aria-label="3D 滑板遊戲畫面"></canvas>

      <!-- 頂部:分數 + 時間 + 連招 -->
      <header class="topbar">
        <span class="score-cap">分數</span>
        <span id="scoreLabel" class="score-label">0</span>
        <span id="timeLabel" class="time-label">60s</span>
        <span id="comboLabel" class="combo-label"></span>
      </header>

      <!-- 速度條(中下方大力道條) -->
      <div class="speed-panel" id="speedPanel" hidden>
        <span id="speedLabel">速度</span>
        <div class="speed-track"><div class="speed-fill" id="speedFill"></div></div>
      </div>

      <div class="message-ribbon" id="statusMessage">選擇難度後開始。</div>
      <div class="commentary-bar" id="commentaryBar" hidden></div>
      <div class="trick-pop" id="trickPop" hidden></div>

      <!-- 操作提示 -->
      <div class="controls-panel" id="controlsPanel" hidden>
        <div id="controlsHint">空白鍵按住=泵(下坡加速)/抓板(空中) ・ A/D 或 ←/→=移動(地面)/轉體(空中) ・ V 視角</div>
      </div>

      <!-- 觸控(按住式) -->
      <div class="touch-controls" id="touchControls">
        <button id="touchLeft" class="touch-action alt">◀</button>
        <button id="touchRight" class="touch-action alt">▶</button>
        <button id="touchPump" class="touch-action">泵/抓板</button>
      </div>

      <div class="hud-buttons">
        <button id="menuButton">選單</button>
        <button id="audioButton">音效開啟</button>
        <button id="cameraButton">視角</button>
        <button id="fullscreenButton" title="全螢幕">⛶ 全螢幕</button>
      </div>

      <!-- 直向轉橫提示 -->
      <div class="rotate-hint" id="rotateHint">
        <div class="rotate-card">
          <div class="rotate-icon">📱↻</div>
          <p>請把裝置轉成<strong>橫向</strong>再玩,大浪才裝得下!</p>
        </div>
      </div>

      <!-- 結算 -->
      <div class="overlay-shell" id="matchOverlay">
        <div class="overlay-card">
          <p class="overlay-eyebrow" id="overlayEyebrow">—</p>
          <h2 id="overlayTitle">—</h2>
          <p id="overlayText">—</p>
          <div class="overlay-actions">
            <button id="overlayMenuButton">回選單</button>
            <button id="overlayReplayButton">再滑一輪</button>
          </div>
        </div>
      </div>

      <!-- 主選單 -->
      <div class="home-screen visible" id="homeScreen">
        <div class="home-card">
          <p class="home-eyebrow">SURFING・定點浪計分賽</p>
          <h1>3D 衝浪</h1>
          <p class="home-sub">泵出速度、飛出池緣、空中轉體抓板、穩穩落地——連續動作分數起飛!</p>

          <div class="home-row">
            <label for="difficultySelect">難度</label>
            <select id="difficultySelect">
              <option value="kids">幼兒（超簡單）</option>
              <option value="child">兒童（簡單）</option>
              <option value="easy" selected>入門</option>
              <option value="normal">標準</option>
              <option value="hard">職業</option>
            </select>
            <label for="audioSelect">音效</label>
            <select id="audioSelect">
              <option value="on" selected>開啟</option>
              <option value="off">靜音</option>
            </select>
          </div>

          <p class="home-hint" id="modeHint">下坡時<strong>按住空白鍵「泵」</strong>越泵越快;衝出浪頂就會飛起來——空中 ←/→ 轉體、按住空白鍵抓板;轉滿整半圈落地=穩!連續穩落地有連招加成。落水只是噗通一聲大水花,馬上爬回板上,放心衝!</p>
          <button class="start-button" id="startButton">開始</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script>
    try {
      if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
        navigator.sendBeacon?.('https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=surfing3d');
      }
    } catch (_) {}
    </script>
  
<script>
// ← 返回大廳(skill back-to-lobby-button):孩子卡住要能離開。DOM 疊在畫面上,不畫進 canvas。
// 退出 ≠ 過關:這裡只導頁,絕不呼叫 onComplete。嵌入時先讓宿主處理。
(function () {
  var LOBBY = 'https://hfpc-olympics.summer09201017.workers.dev';
  function go() {
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    if (window.parent && window.parent !== window) {          // 嵌入:交給宿主收掉關卡視窗
      try { window.parent.postMessage({ type: 'hfpc-exit' }, '*'); } catch (e) {}
      if (history.length > 1) { history.back(); return; }
    }
    location.href = LOBBY;
  }
  function add() {
    if (document.querySelector('[data-hfpc-lobby]')) return;
    var b = document.createElement('button');
    b.textContent = '← 返回大廳';
    b.setAttribute('aria-label', '返回大廳');
    b.setAttribute('data-hfpc-lobby', '1');
    b.style.cssText = 'position:fixed;z-index:2147483000;' +
      'top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));' +
      'min-width:44px;min-height:44px;padding:9px 14px;border:0;border-radius:12px;' +
      'font:600 15px/1.2 system-ui,"Microsoft JhengHei",sans-serif;' +
      'background:rgba(0,0,0,.58);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent';
    b.addEventListener('click', go);
    (document.body || document.documentElement).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add); else add();
})();
</script>
</body>
</html>
